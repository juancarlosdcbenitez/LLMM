<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON - Exercise 3</title>
</head>
<body>
    <h2>NASA APOD</h2>
    <p id="exp"></p>
    <p id="fecha"></p>
    <p id="url"></p>
    <img id="foto" width="400">

    <script>
    const xhttp = new XMLHttpRequest();
    xhttp.onload = function() {
        const obj = JSON.parse(this.responseText);
        document.getElementById("exp").innerHTML = "Explanation: " + obj.explanation;
        document.getElementById("fecha").innerHTML = "Date: " + obj.date;
        document.getElementById("url").innerHTML = "URL: " + obj.url;
        document.getElementById("foto").src = obj.url;
    }
    xhttp.open("GET", "https://api.nasa.gov/planetary/apod?api_key=DEMO_KEY&date=2020-05-01");
    xhttp.send();
    </script>
</body>
</html>
