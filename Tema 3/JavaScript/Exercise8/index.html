
<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <meta http-equiv="X-UA-Compatible" content="ie=edge">
 <title>Recording</title>
 <link rel="stylesheet" href="main.css">
</head>

<body>
 <section class="calculator">
  <form>
   <input type="text" name="" id="" class="screen">
  </form>
  <div class="buttons">
    <button class="btn btn-yellow" data-num="*" onclick="press('*')">*</button>
    <button class="btn btn-yellow" data-num="/" onclick="press('/')">/</button>
    <button class="btn btn-yellow" data-num="-" onclick="press('-')">-</button>
    <button class="btn btn-yellow" data-num="+" onclick="press('+')">+</button>

    <button class="btn btn-grey" data-num="." onclick="press('.')">.</button>
    <button class="btn btn-grey" data-num="9" onclick="press('9')">9</button>
    <button class="btn btn-grey" data-num="8" onclick="press('8')">8</button>
    <button class="btn btn-grey" data-num="7" onclick="press('7')">7</button>
    <button class="btn btn-grey" data-num="6" onclick="press('6')">6</button>
    <button class="btn btn-grey" data-num="5" onclick="press('5')">5</button>
    <button class="btn btn-grey" data-num="4" onclick="press('4')">4</button>
    <button class="btn btn-grey" data-num="3" onclick="press('3')">3</button>
    <button class="btn btn-grey" data-num="2" onclick="press('2')">2</button>
    <button class="btn btn-grey" data-num="1" onclick="press('1')">1</button>
    <button class="btn btn-grey" data-num="0" onclick="press('0')">0</button>

    <button type="button" class="btn-equal btn-grey" onclick="calculate()">=</button>
    <button type="button" class="btn-clear btn-grey" onclick="clearScreen()">C</button>
  </div>

 </section>

 <script src="./app.js"></script>
</body>

</html>
