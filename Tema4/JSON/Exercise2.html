<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON - Exercise 2</title>
</head>
<body>
    <p id="edad"></p>
    <p id="primerTipo"></p>
    <p id="primerNombre"></p>
    <p id="numMascotas"></p>
    <p id="nombresMascotas"></p>
    <p id="parrafo"></p>
    <div id="tabla"></div>

    <script>
    const xhttp = new XMLHttpRequest();
    xhttp.onload = function() {
        const myObj = JSON.parse(this.responseText);
        edad = myObj.age;
        document.getElementById("edad").innerHTML = "Edad: " + edad;
        primerTipo = myObj.pets[0].animal;
        document.getElementById("primerTipo").innerHTML = "Tipo de animal (primera mascota): " + primerTipo;
        primerNombre = myObj.pets[0].name;
        document.getElementById("primerNombre").innerHTML = "Nombre (primera mascota): " + primerNombre;
        numMascotas = myObj.pets.length;
        document.getElementById("numMascotas").innerHTML = "Número de mascotas: " + numMascotas;
        
        txtNombres = "";
        for(i = 0; i < myObj.pets.length; i++)
            txtNombres += myObj.pets[i].name + "<br>";
        document.getElementById("nombresMascotas").innerHTML = "Nombres de todas las mascotas:<br>" + txtNombres;

        parrafo = "Edad: " + edad + ". ";
        parrafo += "Mascotas: ";
        for(i = 0; i < myObj.pets.length; i++) {
            parrafo += myObj.pets[i].animal + " llamada " + myObj.pets[i].name;
            if(i < myObj.pets.length - 1) parrafo += ", ";
        }
        document.getElementById("parrafo").innerHTML = parrafo;
        tabla = "<table border='1'>";
        tabla += "<tr><th>Edad</th><th>Tipo de animal</th><th>Nombre</th></tr>";
        for(i = 0; i < myObj.pets.length; i++) {
            tabla += "<tr><td>" + edad + "</td><td>" +
                     myObj.pets[i].animal + "</td><td>" +
                     myObj.pets[i].name + "</td></tr>";
        }
        tabla += "</table>";
        document.getElementById("tabla").innerHTML = tabla;
    }
    xhttp.open("GET", "https://www.w3schools.com/js/json_demo.txt");
    xhttp.send();
    </script>
</body>
</html>
