<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX - Exercise 2</title>
</head>
<body>
    <h2>Predicción meteorológica</h2>
    <div id="resultado"></div>

    <script>
    const xhttp = new XMLHttpRequest();
    xhttp.onload = function() {
        const xmlDoc = this.responseXML;
        dia = xmlDoc.getElementsByTagName("dia")[0];
        tempMax = dia.getElementsByTagName("temperatura")[0].getElementsByTagName("maxima")[0].childNodes[0].nodeValue;
        tempMin = dia.getElementsByTagName("temperatura")[0].getElementsByTagName("minima")[0].childNodes[0].nodeValue;
        estados = dia.getElementsByTagName("estado_cielo");
        textoEstados = "";
        for(i = 0; i < estados.length; i++) {
            periodo = estados[i].getAttribute("periodo");
            desc = estados[i].getAttribute("descripcion");
            textoEstados += periodo + ": " + desc + "<br>";
        }

        vientos = dia.getElementsByTagName("viento");
        textoViento = "";
        for(i = 0; i < vientos.length; i++) {
            periodo = vientos[i].getAttribute("periodo");
            dir = vientos[i].getElementsByTagName("direccion")[0].childNodes[0]?.nodeValue || "";
            vel = vientos[i].getElementsByTagName("velocidad")[0].childNodes[0]?.nodeValue || "";
            textoViento += periodo + ": " + dir + " " + vel + "<br>";
        }

        humMax = dia.getElementsByTagName("humedad_relativa")[0].getElementsByTagName("maxima")[0].childNodes[0].nodeValue;
        humMin = dia.getElementsByTagName("humedad_relativa")[0].getElementsByTagName("minima")[0].childNodes[0].nodeValue;
        document.getElementById("resultado").innerHTML =
            "<b>Temperatura máxima:</b> " + tempMax + "ºC<br>" +
            "<b>Temperatura mínima:</b> " + tempMin + "ºC<br><br>" +
            "<b>Estado del cielo:</b><br>" + textoEstados + "<br>" +
            "<b>Viento:</b><br>" + textoViento + "<br>" +
            "<b>Humedad relativa máxima:</b> " + humMax + "%<br>" +
            "<b>Humedad relativa mínima:</b> " + humMin + "%<br>";
    }

    xhttp.open("GET", "localidad_21002.xml");
    xhttp.send();
    </script>
</body>
</html>
