<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XML DOM - Exercise 3</title>
</head>
<body>
    <h2>XML DOM's Exercise 3</h2>
    <p id="demo"></p>

    <script>
    const xhttp = new XMLHttpRequest();
    xhttp.onload = function() {

        const xmlDoc = this.responseXML;

        let titulo1 = xmlDoc.getElementsByTagName("title")[0].childNodes[0].nodeValue;

        let titulos = "";
        let n = xmlDoc.getElementsByTagName("title").length;
        for(let i = 0; i < n; i++)
            titulos += xmlDoc.getElementsByTagName("title")[i].childNodes[0].nodeValue + "<br>";

        let numAtributos = xmlDoc.getElementsByTagName("book")[3].attributes.length;

        let valoresAtributos = "";
        let a = xmlDoc.getElementsByTagName("book")[3].attributes;
        for(let i = 0; i < a.length; i++)
            valoresAtributos += a[i].nodeValue + "<br>";

        let numAutores = xmlDoc.getElementsByTagName("book")[2].getElementsByTagName("author").length;

        let autores = "";
        let autoresNodes = xmlDoc.getElementsByTagName("book")[2].getElementsByTagName("author");
        for(let i = 0; i < autoresNodes.length; i++)
            autores += autoresNodes[i].childNodes[0].nodeValue + "<br>";

        let x = xmlDoc.getElementsByTagName("book");
        let tabla = "<table border='1'>";
        tabla += "<tr><th>Título</th><th>Autor</th><th>Precio</th><th>Año</th></tr>";

        for(let i = 0; i < x.length; i++) {
            let titulo = x[i].getElementsByTagName("title")[0].childNodes[0].nodeValue;
            let autor  = x[i].getElementsByTagName("author")[0].childNodes[0].nodeValue;
            let precio = x[i].getElementsByTagName("price")[0].childNodes[0].nodeValue;
            let year   = x[i].getElementsByTagName("year")[0].childNodes[0].nodeValue;

            tabla += "<tr><td>" + titulo + "</td><td>" + autor + "</td><td>" + precio + "</td><td>" + year + "</td></tr>";
        }
        tabla += "</table>";

        document.getElementById("demo").innerHTML =
            "<b>1. Título del primer libro:</b><br>" + titulo1 + "<br><br>" +
            "<b>2. Todos los títulos:</b><br>" + titulos + "<br>" +
            "<b>3. Nº atributos del cuarto libro:</b><br>" + numAtributos + "<br><br>" +
            "<b>4. Valores de los atributos del cuarto libro:</b><br>" + valoresAtributos + "<br>" +
            "<b>5. Nº autores del tercer libro:</b><br>" + numAutores + "<br><br>" +
            "<b>6. Autores del tercer libro:</b><br>" + autores + "<br>" +
            "<b>7. Tabla:</b><br><br>" + tabla;
    }

    xhttp.open("GET", "books.xml");
    xhttp.send();
    </script>
</body>
</html>
