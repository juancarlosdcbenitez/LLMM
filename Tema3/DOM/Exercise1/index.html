<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM - Exercise 1</title>
</head>
<body>
    <h1>Basic DOM Exercise</h1>
    <h2>We're going to show some paragraphs in an empty div</h2>

    <p>JavaScript</p>
    <p>DOM</p>
    <p>Java</p>
    <p>Python</p>
    <p>C++</p>

    <div id="container"></div>

    <script>
        const elements = document.getElementsByTagName('p');
        let text = "";
        for (let i = 0; i < elements.length; i++) {
            text = text + elements[i].textContent + "<br>";
        }
        document.getElementById("container").innerHTML = text;
    </script>
</body>
</html>
