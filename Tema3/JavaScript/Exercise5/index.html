<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercise 5</title>
</head>
<body>

    <h2>Change paragraph style</h2>
    <p id="myParagraph">This is a paragraph that will be changed.</p>

    <button onclick="changeFont1()">Font Arial</button>
    <button onclick="changeFont2()">Font Courier</button>
    <button onclick="changeFont3()">Font Times</button>

    <h2>Change image</h2>
    <img id="myImage" src="img/javascript.png" style="height:300px"><br><br>

    <button onclick="changeImage1()">Image 1</button>
    <button onclick="changeImage2()">Image 2</button>
    <button onclick="changeImage3()">Image 3</button>

    <h2>Show messages</h2>
    <div id="myDiv" style="border:1px solid black; padding:10px; width:300px;">
        Messages will appear here.
    </div><br>
    
    <button onclick="showMessage1()">Message 1</button>
    <button onclick="showMessage2()">Message 2</button>
    <button onclick="showMessage3()">Message 3</button>

    <script src="script.js"></script>
</body>
</html>
