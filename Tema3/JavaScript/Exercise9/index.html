<!DOCTYPE html>
<html>
<head>
<script>

function muestraCelsius() {
    let f = document.getElementById("tbf").value;
    let c = toCelsius(f)
    document.getElementById("tbc").value = c;
}

function muestraFahrenheit() {
    let c = document.getElementById("tbc").value;
    let f = toFahrenheit(c)
    document.getElementById("tbf").value = f;
}

function toFahrenheit(c) {
  return (9/5) * c + 32;
}

function toCelsius(f) {
  return (5/9) * (f-32);
}
</script>
</head>
<body>

<h2>JavaScript Functions</h2>

<p>This example calls a function to convert from Fahrenheit to Celsius:</p>
<label for="tbf">Fahrenheit : </label>
<input type="text" id="tbf" name="tbf"> 
<br>
<label for="tbc">Celcius : </label>
<input type="text" id="tbc" name="tbc"> 
<br>
<button type="button" onclick="muestraCelsius()">Convierte de Fahrenheit a Celsius</button> 
<button type="button" onclick="muestraFahrenheit()">Convierte de Celsius a Fahrenheit</button> 
</body>
</html>
